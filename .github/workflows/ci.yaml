name: CI

# Runs on every pull request, regardless of the target branch. Do not add a
# `branches:` filter here: this repo's default branch is `jest28`, and a filter
# pinned to `main` silently disabled all checks (PRs merged with zero checks).
on:
  pull_request:
  push:
    branches: [ jest28 ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Fails if package-lock.json has drifted from package.json, which is
      # exactly the kind of change most PRs here make (dependency bumps).
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
